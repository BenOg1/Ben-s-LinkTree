main{position:relative;z-index:2;width:100%;max-width:440px;padding:22vh 24px 56px}

.player{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 28px;padding:10px 12px 10px 18px;border:1px solid var(--line);background:rgba(5,5,6,.45);

.player:hover{border-color:var(--ink)}
.player:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.pbtn{flex:none;color:var(--glow)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.state{font-size:14px;color:var(--dim)}
.tname{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:500;font-size:22px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vinyl{flex:none;width:64px;height:64px;filter:drop-shadow(0 0 6px rgba(255,255,255,.22))}

<script>
(function(){
var c=document.getElementById("snow"),x=c.getContext("2d"),w,h,dpr=Math.min(devicePixelRatio||1,2),fl=[];
// soft white sprite so flakes read as slightly out-of-focus specks, like the GIF
var s=document.createElement("canvas");s.width=s.height=64;
var g=s.getContext("2d"),gr=g.createRadialGradient(32,32,0,32,32,32);
gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(.35,"rgba(255,255,255,.7)");gr.addColorStop(1,"rgba(255,255,255,0)");
g.fillStyle=gr;g.fillRect(0,0,64,64);
function size(){w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener("resize",size);
// three depth layers: far specks, mid flakes, a few large blurred ones up close
var L=[{n:130,r:[1.2,2.4],a:[.25,.45],v:[.018,.03]},{n:68,r:[2.4,4.2],a:[.4,.65],v:[.03,.05]},{n:16,r:[7,12],a:[.12,.22],v:[.06,.09]}];
L.forEach(function(l){for(var i=0;i<l.n;i++){var q=Math.random();fl.push({x:Math.random(),y:Math.random(),r:l.r[0]+q*(l.r[1]-l.r[0]),a:l.a[0]+Math.random()*(l.a[1]-l.a[0]),v:l.v[0]+Math.random()*(l.v[1]-l.v[0]),p:Math.random()*6.28,sw:.0015+Math.random()*.003,f:.4+Math.random()*.8})}});
var t0=0;
function tick(t){var dt=Math.min((t-t0)/1000||.016,.05);t0=t;x.clearRect(0,0,w,h);
 fl.forEach(function(p){p.y+=p.v*dt;p.p+=p.f*dt;
  var px=(p.x+Math.sin(p.p)*p.sw*8+t*0.000004*p.v*10)%1;if(px<0)px+=1;
  if(p.y>1.03){p.y=-.03;p.x=Math.random()}
  x.globalAlpha=p.a*(.75+.25*Math.sin(p.p*2));
  var d=p.r*2;x.drawImage(s,px*w-p.r,p.y*h-p.r,d,d)});
 requestAnimationFrame(tick)}
requestAnimationFrame(tick);
})();
</script>
